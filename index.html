<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Science for Little Learners — Flipbook</title>
<style>
  :root{
    --ink:#14181d; --cream:#fff8ec; --navy:#173a5e; --green:#145c33; --gold:#c79a3b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:#22252a;font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;}
  body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;}

  header{
    flex:0 0 auto; display:flex; align-items:center; gap:.6rem;
    background:var(--navy); color:#fff; padding:.45rem .8rem;
    box-shadow:0 2px 8px rgba(0,0,0,.35); z-index:5;
  }
  header .titles{flex:1 1 auto; min-width:0; line-height:1.15;}
  header .book{font-weight:700; font-size:1rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  header .by{font-size:.78rem; color:#ffd98a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  header a.games{
    flex:0 0 auto; text-decoration:none; background:var(--gold); color:#231a04;
    font-weight:700; font-size:.85rem; padding:.5rem .8rem; border-radius:999px;
    box-shadow:0 2px 0 #8a6d1c;
  }
  header a.games:active{transform:translateY(1px); box-shadow:none;}

  #stage{
    flex:1 1 auto; position:relative; display:flex; align-items:center; justify-content:center;
    overflow:hidden; touch-action:manipulation; user-select:none; -webkit-user-select:none;
    background:radial-gradient(ellipse at center,#33373f 0%,#1d2025 75%);
  }
  #bookwrap{
    position:relative; height:100%; max-width:100%;
    display:flex; align-items:center; justify-content:center;
    perspective:1600px;
  }
  #page{
    max-height:100%; max-width:100vw; height:auto; width:auto;
    box-shadow:0 10px 40px rgba(0,0,0,.55); background:#fff; display:block;
  }
  #page.turn-next{animation:flipNext .38s ease;}
  #page.turn-prev{animation:flipPrev .38s ease;}
  @keyframes flipNext{
    0%{transform:rotateY(0deg) translateX(0); opacity:1;}
    45%{transform:rotateY(-14deg) translateX(2.5%); opacity:.82;}
    100%{transform:rotateY(0deg) translateX(0); opacity:1;}
  }
  @keyframes flipPrev{
    0%{transform:rotateY(0deg) translateX(0); opacity:1;}
    45%{transform:rotateY(14deg) translateX(-2.5%); opacity:.82;}
    100%{transform:rotateY(0deg) translateX(0); opacity:1;}
  }
  .zone{
    position:absolute; top:0; bottom:0; width:32%; z-index:3; cursor:pointer;
    display:flex; align-items:center;
  }
  .zone.left{left:0; justify-content:flex-start;}
  .zone.right{right:0; justify-content:flex-end;}
  .zone .hint{
    margin:0 .35rem; width:2.4rem; height:2.4rem; border-radius:50%;
    background:rgba(20,24,29,.45); color:#fff; font-size:1.35rem; line-height:2.4rem;
    text-align:center; opacity:.55; pointer-events:none;
  }

  footer{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:.6rem;
    background:var(--navy); color:#fff; padding:.5rem .8rem; z-index:5;
    box-shadow:0 -2px 8px rgba(0,0,0,.35);
  }
  footer button{
    background:var(--green); color:#fff; border:0; border-radius:999px; cursor:pointer;
    font-size:1rem; font-weight:700; padding:.6rem 1.1rem; min-width:3.2rem;
    box-shadow:0 2px 0 #0c3d21;
  }
  footer button:active{transform:translateY(1px); box-shadow:none;}
  footer button:disabled{opacity:.35; box-shadow:none;}
  #counter{font-size:.95rem; font-weight:600; letter-spacing:.02em; white-space:nowrap;}
  #fsbtn{background:#37506e; box-shadow:0 2px 0 #22364d; padding:.6rem .8rem;}

  #loader{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#ffe9b8; font-size:1rem; z-index:2; pointer-events:none; transition:opacity .3s;
  }
</style>
</head>
<body>

<header>
  <div class="titles">
    <div class="book">Science for Little Learners</div>
    <div class="by">by Zulfiqar Ali Sajid</div>
  </div>
  <a class="games" href="https://zasajid2026-source.github.io/science-games/">🎮 Play the Games</a>
</header>

<div id="stage">
  <div id="loader">Opening your book…</div>
  <div id="bookwrap">
    <img id="page" alt="Book page" draggable="false"/>
    <div class="zone left" id="zonePrev" title="Previous page"><div class="hint">‹</div></div>
    <div class="zone right" id="zoneNext" title="Next page"><div class="hint">›</div></div>
  </div>
</div>

<footer>
  <button id="prevBtn" aria-label="Previous page">← Prev</button>
  <div id="counter">Page 1 / 210</div>
  <button id="fsbtn" aria-label="Fullscreen">⛶</button>
  <button id="nextBtn" aria-label="Next page">Next →</button>
</footer>

<script>
(function(){
  "use strict";
  var TOTAL = 210;
  var cur = 1;
  var img = document.getElementById('page');
  var counter = document.getElementById('counter');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var loader = document.getElementById('loader');
  var cache = {};

  function src(n){ return 'p' + String(n).padStart(3,'0') + '.jpg'; }
  function preload(n){
    if(n < 1 || n > TOTAL || cache[n]) return;
    var im = new Image(); im.src = src(n); cache[n] = im;
  }
  function show(n, dir){
    cur = Math.min(TOTAL, Math.max(1, n));
    img.src = src(cur);
    counter.textContent = 'Page ' + cur + ' / ' + TOTAL;
    prevBtn.disabled = (cur === 1);
    nextBtn.disabled = (cur === TOTAL);
    img.classList.remove('turn-next','turn-prev');
    if(dir){ void img.offsetWidth; img.classList.add(dir > 0 ? 'turn-next' : 'turn-prev'); }
    preload(cur + 1); preload(cur - 1); preload(cur + 2);
    if(window.location.hash !== '#p' + cur){
      try{ history.replaceState(null,'','#p' + cur); }catch(e){}
    }
  }
  function next(){ if(cur < TOTAL) show(cur + 1, 1); }
  function prev(){ if(cur > 1) show(cur - 1, -1); }

  img.addEventListener('load', function(){ loader.style.opacity = '0'; });
  document.getElementById('zoneNext').addEventListener('click', next);
  document.getElementById('zonePrev').addEventListener('click', prev);
  nextBtn.addEventListener('click', next);
  prevBtn.addEventListener('click', prev);
  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight' || e.key === ' '){ next(); e.preventDefault(); }
    else if(e.key === 'ArrowLeft'){ prev(); e.preventDefault(); }
  });

  var fsBtn = document.getElementById('fsbtn');
  fsBtn.addEventListener('click', function(){
    var el = document.documentElement;
    if(document.fullscreenElement){ document.exitFullscreen(); }
    else if(el.requestFullscreen){ el.requestFullscreen(); }
    else if(el.webkitRequestFullscreen){ el.webkitRequestFullscreen(); }
  });

  var start = 1;
  var m = /#p(\d+)/.exec(window.location.hash || '');
  if(m){ start = parseInt(m[1], 10) || 1; }
  show(start, 0);
})();
</script>
</body>
</html>
